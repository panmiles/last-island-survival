<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LAST ISLAND Survival Online 2.0</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a1817;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#login{position:absolute;inset:0;background:linear-gradient(140deg,#092d28,#0b1618);display:grid;place-items:center;z-index:10}#login .panel{width:min(90%,380px);background:#142c29;border:1px solid #396b56;border-radius:22px;padding:26px;text-align:center;box-shadow:0 20px 70px #0008}h1{color:#a7f3b3;margin:0 0 6px}input{width:100%;padding:13px;margin:7px 0;background:#0b211f;border:1px solid #4c7367;border-radius:10px;color:white;font-size:16px}button{background:#2b9a67;color:white;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer}button:active{filter:brightness(1.3)}#hud{position:absolute;top:10px;left:10px;right:10px;display:none;pointer-events:none}.bars{width:180px;background:#0b1d1bc9;padding:9px;border-radius:12px}.bar{height:9px;background:#333;border-radius:8px;margin:5px 0 9px;overflow:hidden}.fill{height:100%;width:100%;background:#f66}#hunger{background:#e6a13e}#energy{background:#60baff}#inventory{background:#0b1d1bc9;padding:9px;border-radius:12px;position:absolute;top:0;right:0;text-align:right;font-size:13px}#controls{display:none;position:absolute;bottom:20px;left:15px;right:15px;align-items:end;justify-content:space-between;pointer-events:none}#stick{width:130px;height:130px;background:#ffffff24;border:2px solid #ffffff55;border-radius:50%;position:relative;pointer-events:auto;touch-action:none}#knob{width:58px;height:58px;background:#c6f7e4aa;border-radius:50%;position:absolute;left:34px;top:34px;pointer-events:none}.actions{display:grid;grid-template-columns:repeat(2,76px);gap:8px;pointer-events:auto}.actions button{padding:12px 5px;background:#195d4de8;border:1px solid #71c49a}#buildPanel{display:none;position:absolute;right:10px;bottom:175px;background:#102c29ed;border:1px solid #60b08d;border-radius:14px;padding:10px;max-width:215px;z-index:3}#buildPanel button{margin:3px;padding:9px;font-size:12px}#buildPanel small{display:block;color:#c6e2d2;margin-bottom:7px}#chat{position:absolute;left:10px;bottom:166px;max-width:min(65vw,300px);font-size:12px;text-shadow:0 1px 3px black;pointer-events:auto}#messages{height:75px;overflow:hidden}#chat input{width:180px;padding:8px;font-size:13px;background:#122b2ad9}#death{display:none;position:absolute;inset:0;background:#000a;place-items:center;z-index:5}#death>div{background:#142b2a;padding:25px;border-radius:18px;text-align:center}#hint{font-size:12px;color:#bed2c5;margin-top:12px}@media(min-width:800px){#controls{bottom:25px}.actions{grid-template-columns:repeat(4,80px)}#chat{bottom:100px}}
</style></head><body><div id="login"><div class="panel"><h1>🏝 LAST ISLAND</h1><p>Survival Online Multiplayer · v2.0</p><input id="name" placeholder="ชื่อผู้เล่น" maxlength="18"><input id="room" placeholder="รหัสห้อง (เช่น island)" value="island" maxlength="20"><button id="join">เข้าสู่เกาะ</button><div id="hint">แชร์รหัสห้องให้เพื่อนเข้ามาเล่นด้วยกัน</div></div></div><canvas id="game"></canvas><div id="hud"><div class="bars">❤️ <span id="hpText">100</span><div class="bar"><div class="fill" id="hp"></div></div>🍗 ความหิว<div class="bar"><div class="fill" id="hunger"></div></div>⚡ พลังงาน<div class="bar"><div class="fill" id="energy"></div></div></div><div id="inventory"></div></div><div id="controls"><div id="stick"><div id="knob"></div></div><div class="actions"><button id="gather">🪓 เก็บ</button><button id="eat">🍓 กิน</button><button id="axe">🔨 ขวาน</button><button id="fire">🔥 กองไฟ</button><button id="buildToggle">🏠 สร้าง</button></div></div><div id="buildPanel"><strong>🏠 สิ่งก่อสร้าง</strong><small>เลือกแบบ แล้วแตะพื้นที่บนแผนที่ใกล้ตัว</small><button data-build="wall">🧱 กำแพง 5🪵</button><button data-build="floor">🟫 พื้น 3🪵</button><button data-build="door">🚪 ประตู 7🪵 1🪨</button><button data-build="hut">🏡 บ้าน 18🪵 8🪨</button><button data-build="spikes">⚔️ รั้วหนาม 5🪵 3🪨</button><button id="cancelBuild">ยกเลิก</button><small id="selectedBuild"></small></div><div id="chat"><div id="messages"></div><input id="msg" placeholder="พิมพ์แชต แล้ว Enter"></div><div id="death"><div><h2>คุณเสียชีวิต</h2><button id="respawn">เกิดใหม่</button></div></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let id=null,world=1800,players=[],resources=[],buildings=[],mobs=[],selectedBuild=null,keys={},joy={x:0,y:0},camera={x:0,y:0};const $=s=>document.getElementById(s);function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
$('join').onclick=()=>socket.emit('join',{name:$('name').value,room:$('room').value});socket.on('joined',d=>{id=d.id;world=d.world;$('login').style.display='none';$('hud').style.display='block';$('controls').style.display='flex'});socket.on('state',s=>{players=s.players;resources=s.resources;buildings=s.buildings||[];mobs=s.mobs||[];const p=players.find(v=>v.id===id);if(!p)return;$('hp').style.width=p.hp+'%';$('hpText').textContent=Math.ceil(p.hp);$('hunger').style.width=p.hunger+'%';$('energy').style.width=p.energy+'%';$('inventory').innerHTML=`🪵 ${p.wood} &nbsp; 🪨 ${p.stone} &nbsp; 🍓 ${p.berry} &nbsp; 🍖 ${p.meat||0}<br>${p.axe?'🪓 ขวานพร้อมใช้':'ไม่มีขวาน'} · 👥 ${players.length} คน`;$('death').style.display=p.dead?'grid':'none'});socket.on('resources',r=>resources=r);function say(t){const el=document.createElement('div');el.textContent=t;$('messages').appendChild(el);while($('messages').children.length>5)$('messages').firstChild.remove()}socket.on('chat',m=>say(m.name+': '+m.text));socket.on('notice',say);
$('gather').onclick=()=>socket.emit('gather');$('eat').onclick=()=>socket.emit('eat');$('axe').onclick=()=>socket.emit('craft','axe');$('fire').onclick=()=>socket.emit('craft','fire');$('respawn').onclick=()=>socket.emit('respawn');$('buildToggle').onclick=()=>{$('buildPanel').style.display=$('buildPanel').style.display==='block'?'none':'block'};document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>{selectedBuild=b.dataset.build;$('selectedBuild').textContent='เลือก '+b.textContent+' — แตะบนแผนที่';});$('cancelBuild').onclick=()=>{selectedBuild=null;$('buildPanel').style.display='none'};canvas.addEventListener('pointerup',e=>{if(!selectedBuild||!id)return;socket.emit('build',{type:selectedBuild,x:e.clientX+camera.x,y:e.clientY+camera.y});});$('msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){socket.emit('chat',e.target.value);e.target.value='';e.target.blur()}});addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.key.toLowerCase()]=true;if(e.key===' ')socket.emit('gather')});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const stick=$('stick'),knob=$('knob');function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1;joy={x:dx/Math.max(48,m),y:dy/Math.max(48,m)};knob.style.transform=`translate(${joy.x*38}px,${joy.y*38}px)`}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))moveStick(e)});function stop(){joy={x:0,y:0};knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);
setInterval(()=>{if(!id)return;let dx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);socket.emit('move',{dx,dy})},33);
function draw(){requestAnimationFrame(draw);const w=innerWidth,h=innerHeight;ctx.fillStyle='#1a6c77';ctx.fillRect(0,0,w,h);const me=players.find(p=>p.id===id);if(me){camera.x=me.x-w/2;camera.y=me.y-h/2;}ctx.save();ctx.translate(-camera.x,-camera.y);ctx.fillStyle='#e0c98d';ctx.fillRect(-25,-25,world+50,world+50);ctx.fillStyle='#417b4a';ctx.fillRect(15,15,world-30,world-30);for(let x=60;x<world;x+=120)for(let y=60;y<world;y+=120){ctx.fillStyle='#4d8b54';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()}
for(const r of resources){if(Math.abs(r.x-camera.x-w/2)>w/2+90||Math.abs(r.y-camera.y-h/2)>h/2+90)continue;ctx.font='34px system-ui';ctx.textAlign='center';ctx.fillText(r.type==='tree'?'🌳':r.type==='rock'?'🪨':'🍓',r.x,r.y+12)}for(const b of buildings){ctx.font=b.type==='hut'?'54px system-ui':'36px system-ui';ctx.textAlign='center';ctx.fillText(({wall:'🧱',floor:'🟫',door:'🚪',hut:'🏡',spikes:'🪵'})[b.type]||'🏠',b.x,b.y+13)}for(const m of mobs){if(m.hp<=0)continue;ctx.font='32px system-ui';ctx.textAlign='center';ctx.fillText(m.type==='wolf'?'🐺':'🐗',m.x,m.y+10);ctx.fillStyle='#3b1d1d';ctx.fillRect(m.x-20,m.y-28,40,5);ctx.fillStyle='#ff6666';ctx.fillRect(m.x-20,m.y-28,40*Math.max(0,m.hp)/(m.type==='wolf'?90:65),5)}for(const p of players){ctx.fillStyle=p.dead?'#777':p.id===id?'#ffda6b':'#7ad4ff';ctx.beginPath();ctx.arc(p.x,p.y,17,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#173d39';ctx.lineWidth=3;ctx.stroke();ctx.font='bold 13px system-ui';ctx.fillStyle='white';ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.fillText(p.name,p.x,p.y-26);ctx.shadowBlur=0;if(p.campfire>Date.now()){ctx.font='28px system-ui';ctx.fillText('🔥',p.x+28,p.y+22)}}ctx.restore();if(selectedBuild&&me){ctx.strokeStyle='#a5f3b6';ctx.lineWidth=2;ctx.beginPath();ctx.arc(me.x-camera.x,me.y-camera.y,125,0,Math.PI*2);ctx.stroke();}if(!id){ctx.fillStyle='#ffffff99';ctx.font='16px system-ui';ctx.fillText('LAST ISLAND',20,30)}}draw();
</script></body></html>
