<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LAST ISLAND 3D</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#102723;color:white;font:14px system-ui;touch-action:none}canvas{display:block}button,input{font:inherit;border:1px solid #6f9f86;border-radius:10px;padding:9px;background:#183f35;color:#fff}button{cursor:pointer}button:active{background:#478968}#login{position:absolute;inset:0;z-index:8;background:linear-gradient(130deg,#0b2926,#1b4b3d);display:grid;place-items:center}#login .panel{width:min(94vw,650px);max-height:94dvh;overflow:auto;background:#102b29;border:1px solid #4a8b72;border-radius:18px;padding:16px;text-align:center}h1{margin:0;color:#c2ffca}#login input{width:47%;margin:8px 1%}.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:12px 0}.avatar{padding:7px 1px;font-size:11px;min-width:0}.avatar span{display:block;font-size:26px}.avatar.selected{border-color:#ffda6e;background:#53714c}#join{width:100%;background:#278960}#hud{display:none;position:absolute;inset:0;pointer-events:none}#stats{position:absolute;left:8px;top:7px;background:#071e1ac9;border-radius:12px;padding:9px;font-size:12px;min-width:135px}meter{width:100%;height:10px}#inventory{position:absolute;right:8px;top:7px;background:#071e1ac9;border-radius:12px;padding:9px;text-align:right;pointer-events:auto}#inventory button{font-size:12px;padding:5px}#controls{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end}#stick{height:110px;width:110px;border-radius:50%;background:#ffffff27;border:2px solid #ffffff77;pointer-events:auto;position:relative}#knob{position:absolute;width:44px;height:44px;border-radius:50%;background:#b9efcaad;left:31px;top:31px}.actions{display:grid;grid-template-columns:repeat(3,66px);gap:5px;pointer-events:auto}.actions button{font-size:11px;padding:9px 3px;background:#124c3fdf}.actions button.active{background:#bb8834}#buildPanel{display:none;position:absolute;right:10px;bottom:130px;z-index:4;background:#0b2928f2;border-radius:12px;padding:8px;pointer-events:auto;max-width:270px}#buildPanel button{margin:2px;padding:7px;font-size:11px}#buildStatus{display:none;position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:5;pointer-events:auto;background:#0b2928f2;border:1px solid #f0b35b;border-radius:14px;padding:9px 12px;align-items:center;gap:10px;max-width:90vw;box-shadow:0 4px 20px #0007}#buildStatus span{font-size:12px}#cancelBuildNow{background:#a72d2d;border-color:#ff9999;font-weight:700;white-space:nowrap;min-height:42px}#buildToggle.active{background:#a67424}.actions button{min-height:44px}#stick{z-index:6}#buildPanel{max-height:65dvh;overflow:auto}#chat{position:absolute;bottom:10px;left:125px;pointer-events:auto;font-size:11px;max-width:180px}#messages{max-height:48px;overflow:hidden;text-shadow:0 1px 3px #000}#msg{width:155px;padding:5px;font-size:12px}#death{display:none;position:absolute;inset:0;background:#000b;z-index:9;place-items:center;pointer-events:auto}#rotate{display:none;position:absolute;inset:0;z-index:20;background:#102a25;place-items:center;text-align:center;padding:25px}@media(orientation:portrait) and (max-width:767px){#rotate{display:grid}}@media(max-height:430px){#login .panel{padding:8px}#login h1{font-size:19px}.avatars{margin:4px 0}.avatar{padding:3px 0}.avatar span{font-size:19px}#stick{width:88px;height:88px}#knob{left:22px;top:22px}.actions{grid-template-columns:repeat(4,60px)}.actions button{padding:7px 2px}#buildPanel{bottom:105px}}
</style></head><body><div id="rotate">📱 หมุนโทรศัพท์เป็นแนวนอนเพื่อเล่น LAST ISLAND 3D</div><div id="login"><div class="panel"><h1>🏝 LAST ISLAND 3D</h1><small>Survival Multiplayer · 3D Character Edition</small><div><input id="name" placeholder="ชื่อผู้เล่น" maxlength="18"><input id="room" value="island" placeholder="รหัสห้อง" maxlength="20"></div><div>เลือกตัวละคร 3D</div><div class="avatars" id="avatars"></div><button id="join">เข้าเล่นบนเกาะ</button><div id="error" style="color:#ffb6a5;margin:6px"></div></div></div><div id="hud"><div id="stats">❤️ <span id="hpText">100</span><meter id="hp" max="100" value="100"></meter>🍗 ความหิว<meter id="hunger" max="100" value="100"></meter>⚡ พลังงาน<meter id="energy" max="100" value="100"></meter></div><div id="inventory"></div><div id="controls"><div id="stick"><div id="knob"></div></div><div class="actions"><button id="gather">⚔️ โจมตี/เก็บ</button><button id="run">🏃 วิ่ง</button><button id="eat">🍓 กิน</button><button id="axe">🪓 ขวาน</button><button id="armor">🛡️ เกราะ</button><button id="fire">🔥 กองไฟ</button><button id="buildToggle">🏠 สร้าง</button></div></div><div id="buildStatus"><span id="buildHint">🏠 โหมดสร้าง: แตะพื้นที่เพื่อวาง</span><button id="cancelBuildNow" type="button">✕ ยกเลิกสร้าง</button></div><div id="buildPanel">เลือกสิ่งก่อสร้าง แล้วแตะพื้นใกล้ตัว<br><button data-build="wall">กำแพง 5🪵</button><button data-build="floor">พื้น 3🪵</button><button data-build="door">ประตู 7🪵1🪨</button><button data-build="hut">บ้าน 18🪵8🪨</button><button data-build="spikes">รั้วหนาม 5🪵3🪨</button><button id="cancelBuild">ยกเลิก</button></div><div id="chat"><div id="messages"></div><input id="msg" placeholder="แชต แล้ว Enter"></div></div><div id="death"><div><h2>คุณเสียชีวิต</h2><button id="respawn">เกิดใหม่</button></div></div><script src="/socket.io/socket.io.js"></script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const $=x=>document.getElementById(x),AVATARS=[['explorer','🧑‍🚀','#dca44d'],['shadow','🥷','#36394c'],['rescuer','👩‍🚒','#dd5b4b'],['mystic','🧙','#8156b7'],['farmer','👨‍🌾','#679b57'],['guardian','🦸','#478eb3']];let avatar='explorer',id=null,world=1800,players=[],resources=[],buildings=[],mobs=[],selectedBuild=null,runToggle=false,joy={x:0,y:0},keys={},latest={};const socket=io();
for(const [name,emoji] of AVATARS){const b=document.createElement('button');b.className='avatar'+(name===avatar?' selected':'');b.innerHTML=`<span>${emoji}</span>${name}`;b.onclick=()=>{avatar=name;document.querySelectorAll('.avatar').forEach(v=>v.classList.toggle('selected',v===b))};$('avatars').appendChild(b)}
const scene=new THREE.Scene();scene.background=new THREE.Color('#77b9c5');scene.fog=new THREE.Fog('#77b9c5',400,1050);const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,1,1800);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;document.body.insertBefore(renderer.domElement,$('login'));scene.add(new THREE.HemisphereLight(0xffffff,0x456b43,2.0));const sun=new THREE.DirectionalLight(0xfff2c4,2.2);sun.position.set(80,180,70);scene.add(sun);const material=c=>new THREE.MeshLambertMaterial({color:c});const mats={grass:material('#5c925b'),sand:material('#ddc890'),sea:material('#3c9eae'),wood:material('#8c5c36'),rock:material('#9da7a5'),leaf:material('#2c7144'),skin:material('#d6a17b'),iron:material('#aabac5')};function cube(parent,w,h,d,mat,x=0,y=0,z=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);parent.add(m);return m}function ball(parent,r,mat,x,y,z){const m=new THREE.Mesh(new THREE.SphereGeometry(r,8,6),mat);m.position.set(x,y,z);parent.add(m);return m}
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(2600,2600),mats.sea);ocean.rotation.x=-Math.PI/2;ocean.position.y=-2;scene.add(ocean);const sand=new THREE.Mesh(new THREE.PlaneGeometry(world+55,world+55),mats.sand);sand.rotation.x=-Math.PI/2;sand.position.y=-.8;scene.add(sand);const grass=new THREE.Mesh(new THREE.PlaneGeometry(world-40,world-40),mats.grass);grass.rotation.x=-Math.PI/2;grass.position.y=-.6;scene.add(grass);const ground=new THREE.Group();scene.add(ground);const objectGroups={players:new Map(),resources:new Map(),buildings:new Map(),mobs:new Map()};const faceMaterials={};
function character(p){const g=new THREE.Group();const outfit=material((AVATARS.find(a=>a[0]===p.avatar)||AVATARS[0])[2]);const skin=material(p.avatar==='shadow'?'#9e7a63':'#dfb18b');const pants=material('#344459');const armor=material('#bdc8d0');const torso=cube(g,13,19,8,p.armor?armor:outfit,0,27,0);const head=cube(g,11,11,10,skin,0,43,0);cube(g,12,4,11,material(p.avatar==='farmer'?'#bc944c':'#42352e'),0,50,0);const leftArm=new THREE.Group(),rightArm=new THREE.Group(),leftLeg=new THREE.Group(),rightLeg=new THREE.Group();leftArm.position.set(-9,35,0);rightArm.position.set(9,35,0);leftLeg.position.set(-4,17,0);rightLeg.position.set(4,17,0);g.add(leftArm,rightArm,leftLeg,rightLeg);cube(leftArm,5,15,6,p.armor?armor:outfit,0,-6,0);cube(rightArm,5,15,6,p.armor?armor:outfit,0,-6,0);cube(leftLeg,6,16,7,pants,0,-8,0);cube(rightLeg,6,16,7,pants,0,-8,0);const axe=new THREE.Group();axe.position.set(1,-13,0);cube(axe,2,21,2,mats.wood,0,-2,0);cube(axe,10,7,3,mats.iron,-3,5,0);rightArm.add(axe);axe.visible=p.equipped==='axe'&&p.axe;const shield=cube(g,16,19,10,armor,0,28,0);shield.visible=Boolean(p.armor);torso.visible=!p.armor;g.userData={leftArm,rightArm,leftLeg,rightLeg,axe,shield,torso,avatar:p.avatar,armor:p.armor,prevX:p.x,prevY:p.y};return g}
function resourceMesh(r){const g=new THREE.Group();if(r.type==='tree'){cube(g,9,34,9,mats.wood,0,17,0);ball(g,24,mats.leaf,0,46,0);ball(g,18,mats.leaf,15,39,5)}else if(r.type==='rock'){ball(g,15,mats.rock,0,11,0)}else{cube(g,6,12,6,mats.wood,0,6,0);ball(g,12,mats.leaf,0,17,0);ball(g,5,material('#ed4d62'),7,16,5)}return g}
function buildingMesh(b){const g=new THREE.Group();if(b.type==='hut'){cube(g,63,46,55,mats.wood,0,23,0);const roof=cube(g,74,8,68,material('#59472f'),0,52,0);roof.rotation.z=.13;cube(g,15,29,4,material('#493521'),0,14,29)}else if(b.type==='floor'){cube(g,46,3,46,mats.wood,0,1,0)}else if(b.type==='spikes'){for(let i=-1;i<=1;i++){const cone=new THREE.Mesh(new THREE.ConeGeometry(6,29,4),mats.wood);cone.position.set(i*13,14,0);g.add(cone)}}else cube(g,b.type==='door'?25:47,35,8,mats.wood,0,17,0);return g}
function mobMesh(m){const g=new THREE.Group(),fur=material(m.type==='wolf'?'#747c80':'#795a47');cube(g,23,16,34,fur,0,16,0);cube(g,18,17,18,fur,0,23,-21);for(const x of [-8,8])for(const z of [-11,11])cube(g,6,13,7,fur,x,7,z);for(const x of [-5,5])cube(g,3,5,3,mats.iron,x,26,-31);return g}
function sync(map,arr,create){const seen=new Set();for(const o of arr){if(o.hp!==undefined&&o.hp<=0&&map===objectGroups.mobs)continue;const key=o.id;seen.add(key);let m=map.get(key);if(!m){m=create(o);scene.add(m);map.set(key,m)}if(map===objectGroups.players&&(m.userData.avatar!==o.avatar||m.userData.armor!==o.armor)){scene.remove(m);m=character(o);scene.add(m);map.set(key,m)}m.position.set(o.x-world/2,0,o.y-world/2);if(map===objectGroups.players){const data=m.userData;const delta=Math.hypot(o.x-data.prevX,o.y-data.prevY);const moving=delta>0.5;const speed=o.running?2.4:1.1;const t=performance.now()/170*speed;data.leftLeg.rotation.x=moving?Math.sin(t)*.6:0;data.rightLeg.rotation.x=moving?-Math.sin(t)*.6:0;data.leftArm.rotation.x=moving?-Math.sin(t)*.4:0;data.rightArm.rotation.x=o.attackingUntil>Date.now()?-1.9+(Math.sin(performance.now()/70)*.45):(moving?Math.sin(t)*.4:0);data.axe.visible=o.equipped==='axe'&&o.axe;data.prevX=o.x;data.prevY=o.y;if(Number.isFinite(o.facing))m.rotation.y=-o.facing-Math.PI/2;m.visible=!o.dead}}for(const [key,m]of map)if(!seen.has(key)){scene.remove(m);map.delete(key)}}
function syncScene(){sync(objectGroups.players,players,character);sync(objectGroups.resources,resources,resourceMesh);sync(objectGroups.buildings,buildings,buildingMesh);sync(objectGroups.mobs,mobs,mobMesh)}
$('join').onclick=()=>socket.emit('join',{name:$('name').value,room:$('room').value,avatar});socket.on('connect_error',()=>{$('error').textContent='เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'});socket.on('joined',d=>{id=d.id;world=d.world;$('login').style.display='none';$('hud').style.display='block'});socket.on('state',s=>{players=s.players;resources=s.resources;buildings=s.buildings||[];mobs=s.mobs||[];const p=players.find(v=>v.id===id);if(!p)return;latest=p;$('hp').value=p.hp;$('hpText').textContent=Math.ceil(p.hp);$('hunger').value=p.hunger;$('energy').value=p.energy;$('death').style.display=p.dead?'grid':'none';$('inventory').innerHTML=`🪵 ${p.wood}　🪨 ${p.stone}　🍓 ${p.berry}　🍖 ${p.meat}<br>${p.axe?'<button id="equip">🪓 '+(p.equipped==='axe'?'เก็บขวาน':'ถือขวาน')+'</button>':'คราฟต์ขวานเพื่อถืออาวุธ'}　${p.armor?'🛡️ สวมเกราะ':''}　👥 ${players.length}`});
function notice(t){const d=document.createElement('div');d.textContent=t;$('messages').appendChild(d);while($('messages').children.length>4)$('messages').firstChild.remove()}socket.on('notice',notice);socket.on('chat',m=>notice(m.name+': '+m.text));$('inventory').onclick=e=>{if(e.target.id==='equip')socket.emit('equip','axe')};for(const [btn,event,data]of [['gather','gather'],['eat','eat'],['axe','craft','axe'],['armor','craft','armor'],['fire','craft','fire'],['respawn','respawn']])$(btn).onclick=()=>socket.emit(event,data);$('run').onclick=()=>{runToggle=!runToggle;$('run').classList.toggle('active',runToggle)};function updateBuildUI(){const active=Boolean(selectedBuild);$('buildStatus').style.display=active?'flex':'none';$('buildToggle').classList.toggle('active',active);$('buildToggle').textContent=active?'✕ ยกเลิกสร้าง':'🏠 สร้าง';$('buildHint').textContent=active?'🏠 เลือก '+({wall:'กำแพง',floor:'พื้น',door:'ประตู',hut:'บ้าน',spikes:'รั้วหนาม'}[selectedBuild]||selectedBuild)+' · แตะพื้นเพื่อวาง':'เข้าโหมดสร้าง'}
function cancelBuild(){selectedBuild=null;$('buildPanel').style.display='none';updateBuildUI()}
$('buildToggle').onclick=()=>{if(selectedBuild){cancelBuild();return}$('buildPanel').style.display=$('buildPanel').style.display==='block'?'none':'block'};
$('cancelBuild').onclick=cancelBuild;$('cancelBuildNow').onclick=cancelBuild;
document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>{selectedBuild=b.dataset.build;$('buildPanel').style.display='none';resetStick();updateBuildUI();notice('แตะพื้นเพื่อวาง หรือกดยกเลิกสร้างเพื่อเดินต่อ')});
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);renderer.domElement.addEventListener('pointerup',e=>{if(!selectedBuild||!id)return;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);raycaster.setFromCamera(pointer,camera);const pt=new THREE.Vector3();if(raycaster.ray.intersectPlane(groundPlane,pt)){socket.emit('build',{type:selectedBuild,x:pt.x+world/2,y:pt.z+world/2});cancelBuild()}});$('msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){socket.emit('chat',e.target.value);e.target.value='';e.target.blur()}});// Mobile joystick: capture one pointer, ignore other fingers, and release safely.
const stick=$('stick'),knob=$('knob');
let stickPointer=null;
function resetStick(){stickPointer=null;joy={x:0,y:0};knob.style.transform='translate(0px,0px)'}
function setStick(e){
  const r=stick.getBoundingClientRect();
  const x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
  const radius=Math.max(18,Math.min(r.width,r.height)*.34);
  const length=Math.hypot(x,y),scale=length>radius?radius/length:1;
  joy={x:x*scale/radius,y:y*scale/radius};
  knob.style.transform=`translate(${x*scale}px,${y*scale}px)`;
}
stick.style.touchAction='none';
stick.addEventListener('pointerdown',e=>{
  if(stickPointer!==null)return;
  e.preventDefault();if(selectedBuild)cancelBuild();stickPointer=e.pointerId;
  stick.setPointerCapture(e.pointerId);setStick(e);
});
stick.addEventListener('pointermove',e=>{
  if(e.pointerId!==stickPointer)return;
  e.preventDefault();setStick(e);
});
for(const type of ['pointerup','pointercancel','lostpointercapture']){
  stick.addEventListener(type,e=>{if(e.pointerId===stickPointer)resetStick()});
}
addEventListener('blur',()=>{resetStick();keys={}});
addEventListener('visibilitychange',()=>{if(document.hidden){resetStick();keys={}}});
addEventListener('keydown',e=>{
  if(e.target instanceof HTMLElement && ['INPUT','TEXTAREA'].includes(e.target.tagName))return;
  const k=e.key.toLowerCase();keys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(k==='escape'){cancelBuild();return}if(k===' '&&!e.repeat)socket.emit('gather');
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
// Send a normalized movement vector; movement is independent of device FPS.
setInterval(()=>{
  if(!id||!socket.connected)return;
  let dx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  let dy=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  const length=Math.hypot(dx,dy);
  if(length>1){dx/=length;dy/=length}
  socket.emit('move',{dx,dy,run:runToggle||Boolean(keys.shift)});
},33);
function draw(){requestAnimationFrame(draw);syncScene();const p=players.find(v=>v.id===id);if(p){const target=new THREE.Vector3(p.x-world/2,0,p.y-world/2);camera.position.lerp(new THREE.Vector3(target.x+85,155,target.z+195),.11);camera.lookAt(target.x,18,target.z)}renderer.render(scene,camera)}draw();function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
</script></body></html>
